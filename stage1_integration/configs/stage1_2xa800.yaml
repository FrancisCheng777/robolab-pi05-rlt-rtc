defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PI05_PROJECT_ROOT}/vendor/rlinf_stage1/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250
  resume_dir: null
  logger:
    log_path: ${oc.env:PI05_PROJECT_ROOT}/outputs/stage1
    project_name: pi05_plug_demo
    experiment_name: ${oc.env:PI05_RUN_NAME,plug_full_sft}
    logger_backends: [tensorboard]

stage1:
  expected_world_size: 2
  minimum_gpu_gib: 75
  synthetic: false
  dataset_root: ${oc.env:PI05_DATASET,${oc.env:PI05_PROJECT_ROOT}/data/datasets/plug_v1}
  tokenizer_path: ${oc.env:PI05_TOKENIZER,${oc.env:PI05_PROJECT_ROOT}/stage1/assets/paligemma_tokenizer.model}
  num_workers: 0
  gradient_audit_steps: 2

data:
  train_data_paths:
    - dataset_path: ${stage1.dataset_root}
      weight: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  # Keep the upstream effective batch; two GPUs accumulate 128 micro-batches each.
  global_batch_size: 256
  seed: 0
  enable_offload: false
  model:
    model_path: ${oc.env:PI05_BASE_MODEL,${oc.env:PI05_PROJECT_ROOT}/assets/pi05_base}
    model_type: openpi
    precision: fp32
    is_lora: false
    add_value_head: false
    action_dim: 8
    num_action_chunks: 10
    num_steps: 5
    openpi:
      task: sft
      config_name: pi05_plug_joint
      num_images_in_input: 1
      train_expert_only: false
      action_horizon: 10
      action_chunk: 10
      action_env_dim: 8
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      torch_compile: false
      rtc_enabled: false
      use_rlt: true
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_use_mask: true
      rlt_image_only: false
  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2000
    lr_warmup_steps: 500
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    allow_openpi_full_sft: true
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    # This switch controls no_sync(), NOT whether loss/gradient accumulation occurs.
    enable_gradient_accumulation: false
    cpu_offload: false
    forward_prefetch: false
    backward_prefetch: null
    limit_all_gathers: true
    save_full_model_weights: true
    # FP32 stored weights, gradients and Adam states; BF16 compute via autocast.
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
