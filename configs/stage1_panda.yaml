# Physical data only. GPU memory/performance must be measured.
# Gradient checkpointing remains off: the pinned SFT path disables it internally.
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "panda_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250

data:
  train_data_paths:
    - dataset_path: "${oc.env:PI05_DATASET_ROOT}/train"
      weight: 1.0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0

  model:
    model_path: "${oc.env:PI05_BASE_CHECKPOINT}"
    model_type: "openpi"
    num_action_chunks: 10
    action_dim: 8
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_rlt_panda_robotiq_joint"
      num_images_in_input: 1
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      rtc_enabled: False
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      repo_id: "local/pi05_plug_train"
      default_prompt: "insert the plug into the power strip"
      # Required: exact train-only statistics from the physical export.
      norm_stats_path: "${oc.env:PI05_DATASET_ROOT}/norm_stats.json"

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
