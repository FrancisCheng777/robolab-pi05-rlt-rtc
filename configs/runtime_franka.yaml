# Pure physical-robot pipeline. H/C/D require measured full-VJP latency validation.
version: 1
platform: franka
action_contract_id: panda_delta_q0.05_robotiq_width0.085_v2
prompt: insert the plug into the power strip
horizon: {horizon: 10, chunk: 5, delay: 2}
control_hz: 15
rtc: {mode: full_vjp, num_steps: 5}
model:
  rlinf_root: ../stage1_integration/vendor/rlinf_stage1
  checkpoint: null  # Stage-1 full weights, including trained RLT
  norm_stats: null  # statistics computed on real training demonstrations only
  config_name: pi05_rlt_panda_robotiq_joint
  dataset_id: local/pi05_plug_train
  device: cuda:0
  precision: bf16
  z_dim: 2048
policy: {kind: teacher, checkpoint: null}
franka:
  socket: /tmp/robolab-rlt.sock
  bridge_config: ../vendor/robolab-collecting-pipeline/configs/latency/responsive_recording/bridge.trial.json
  rpc_timeout_s: 0.05
  max_state_age_s: 0.05
  max_camera_age_s: 0.20
  max_camera_skew_s: 0.08
  cameras:
    factory: pi05_rlt_rtc.adapters.cameras_panda:create_provider
    kwargs:
      views: [wrist]
      wrist_serial: "262622272972"
      wrist_model: D405
training:
  reward_source: manual_terminal
  gamma_per_tick: 0.99
  replay_capacity: 10000
  batch_size: 32
  actor_lr: 0.0001
  critic_lr: 0.0003
  lambda_q: 0.1
  lambda_bc: 1.0
  reference_dropout: 0.1
  polyak_tau: 0.005
  reward_scheme: rlt_binary
  exploration_std: 0.002  # RLinf RLT: Gaussian logits noise before tanh; not radians
session:
  collection_config: ../vendor/robolab-collecting-pipeline/configs/latency/responsive_recording/collection.trial.json
  bridge_binary: ../build/bridge-real/pi05_franka_bridge
  control_python: .venv-runtime/bin/python
  warmup_episodes: 5
  min_replay_transitions: 32
  warmup_updates: 100
  updates_per_episode: 100
  max_approach_ticks: 900
  max_critical_ticks: 450
